<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rabbit Hole Map</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        background: linear-gradient(#4aa3ff, #8fd1ff);
        color: #2b2857;
        font:
          13px/1.5 'Arial Rounded MT Bold',
          'Hiragino Maru Gothic ProN',
          ui-rounded,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .card {
        background: #fff6d8;
        border: 3px solid #2b2857;
        border-radius: 16px;
        box-shadow: 0 4px 0 rgba(43, 40, 87, 0.55);
        padding: 14px 16px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      h1 .hole {
        color: #ff4d6d;
      }
      h1 .map {
        color: #06d6a0;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 5px 12px;
        margin: 0 0 12px;
      }
      dt {
        font-weight: 700;
      }
      dt .em {
        margin-right: 4px;
      }
      dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #wasted {
        margin: 0 0 12px;
        padding: 7px 10px;
        text-align: center;
        font-weight: 700;
        background: #2b2857;
        color: #ffd60a;
        border-radius: 999px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: 3px solid #2b2857;
        border-radius: 12px;
        background: #ffd60a;
        color: #2b2857;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 3px 0 #2b2857;
      }
      button:hover {
        background: #ffe14d;
      }
      button:active {
        transform: translateY(3px);
        box-shadow: 0 0 0 #2b2857;
      }
      #none {
        margin: 0 0 12px;
        font-weight: 700;
      }
      .tagline {
        text-align: center;
        font-size: 11px;
        margin: 10px 0 0;
        opacity: 0.75;
      }
      [data-tip] {
        position: relative;
      }
      [data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 12px);
        left: 50%;
        transform: translateX(-50%) scale(0);
        background: #2b2857;
        color: #fff6d8;
        border: 2px solid #fff6d8;
        border-radius: 10px;
        padding: 5px 11px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        pointer-events: none;
        z-index: 100;
        transition: transform 0.15s cubic-bezier(0.34, 1.8, 0.64, 1) 0.3s;
      }
      [data-tip]::before {
        content: '';
        position: absolute;
        bottom: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%) scale(0);
        border: 6px solid transparent;
        border-top-color: #fff6d8;
        pointer-events: none;
        z-index: 100;
        transition: transform 0.15s cubic-bezier(0.34, 1.8, 0.64, 1) 0.3s;
      }
      [data-tip]:hover::after,
      [data-tip]:hover::before {
        transform: translateX(-50%) scale(1);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>🐰 Rabbit <span class="hole">Hole</span> <span class="map">Map</span></h1>
      <p id="none" hidden>No trail yet — PRESS START!<br />(a.k.a. go click some links)</p>
      <dl id="stats" hidden>
        <dt><span class="em">📄</span>Pages visited</dt>
        <dd id="pages"></dd>
        <dt><span class="em">🐾</span>Hops</dt>
        <dd id="hops"></dd>
        <dt><span class="em">🕳️</span>Deepest burrow</dt>
        <dd id="chain"></dd>
        <dt><span class="em">🏰</span>Top haunt</dt>
        <dd id="domain"></dd>
      </dl>
      <p id="wasted" hidden></p>
      <button id="open" data-tip="Behold the whole burrow in a new tab">🗺️ Open the map</button>
      <p class="tagline">A few more hours won't hurt.</p>
    </main>
    <script src="../../dist/popup.js"></script>
  </body>
</html>

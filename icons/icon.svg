<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The white rabbit peeking out of its hole, on the sky-blue badge.
       Same geometry as the old hand-rolled encoder (unit coords × 128):
       paint order bottom-up = sky, hole, ears (white, pink inner), head,
       nose, eyes. -->
  <clipPath id="disc"><circle cx="64" cy="64" r="64"/></clipPath>
  <g clip-path="url(#disc)">
    <rect width="128" height="128" fill="#4aa3ff"/>
    <ellipse cx="64" cy="102.4" rx="46.08" ry="14.08" fill="#2b2857"/>
    <g stroke-linecap="round">
      <path d="M50.56 20.48V53.76M77.44 20.48V53.76" stroke="#ffffff" stroke-width="16.128"/>
      <path d="M50.56 25.6V48.64M77.44 25.6V48.64" stroke="#ff9eb5" stroke-width="6.912"/>
    </g>
    <circle cx="64" cy="74.24" r="27.52" fill="#ffffff"/>
    <circle cx="64" cy="78.72" r="2.688" fill="#ff9eb5"/>
    <circle cx="55.68" cy="71.04" r="3.072" fill="#2b2857"/>
    <circle cx="72.32" cy="71.04" r="3.072" fill="#2b2857"/>
  </g>
</svg>
